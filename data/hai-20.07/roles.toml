#  Control loops (ADR 0126), one per loop statement on pp. 7-11, transcribed from the `loop`
#  lines above and nothing else. A loop names the reading it holds and the actuators it moves
#  only where its statement names them: P2-SC names no output and P3-LC no reading, so neither
#  is completed from tag names. The plant map bars a loop's outputs, and what they drive, from
#  the level form of the reading it holds; ADR 0123's wider rule still covers the gaps.

[[loops]]
name = "P1-PC"
cited = "Control loops (p. 7)"
statement = "valves PCV01D and PCV02D hold pressure PIT01 at the operator's setpoint command B2016"
reading = "P1_PIT01"
outputs = ["P1_PCV01D", "P1_PCV02D"]
setpoint = "P1_B2016"

[[loops]]
name = "P1-LC"
cited = "Control loops (p. 7)"
statement = "valve LCV01D holds level LIT01 at the operator's setpoint command B3004"
reading = "P1_LIT01"
outputs = ["P1_LCV01D"]
setpoint = "P1_B3004"

[[loops]]
name = "P1-FC"
cited = "Control loops (p. 7)"
statement = "valve FCV03D holds outflow FT03 at the operator's setpoint command B3005"
reading = "P1_FT03"
outputs = ["P1_FCV03D"]
setpoint = "P1_B3005"

[[loops]]
name = "P1-TC"
cited = "Control loops (p. 7)"
statement = "valves FCV01D and FCV02D hold temperature TIT01 at the operator's setpoint command B4022"
reading = "P1_TIT01"
outputs = ["P1_FCV01D", "P1_FCV02D"]
setpoint = "P1_B4022"

[[loops]]

#  HAI 20.07 — signal roles (ADR 0123 §3)
#
#  Sensor, actuator or setpoint for each of the 59 SCADA columns of HAI 20.07, read from the
#  corpus authors' manual and from nothing else. Never inferred from the data, and never from a
#  tag's name: P1_FCV01D suggests a valve command, and a suggestion is not a declaration.
#
#  Sole source, cited throughout as "the manual" with its own printed page numbers (the PDF's
#  page index is one higher):
#
#      HAI Dataset Technical Details, document version 4.0, May 2023 (CC BY-SA 4.0).
#      hai_dataset_technical_details.pdf at commit 2a814cebc9a66b06c9e5cd545e2d72e65d383737
#      of github.com/icsdataset/hai, git blob 18cb88514176e1c641f584cf24ac8e9559432b38.
#
#  How each row was read:
#
#    1. The point is the manual's data-points table row (pp. 12-15) with the column's name, or,
#       where the 20.07 column of that table prints a different 20.07 name in parentheses, the
#       row carrying it: "(Auto)" under P2_AutoGo is the 20.07 column P2_Auto. A column with
#       neither is given no role.
#    2. The role is the one the row's own description states. "setpoint", "set-point" and
#       "demand" are setpoints. A valve or pump "command", a "current position" and a "control
#       output" are actuators. A measured, converted or reported process value is a sensor.
#       An operator button or switch is none of the three, and is given no role.
#    3. Where a control-loop statement (pp. 7-11) also names the point, it is cited as `loop`.
#       Every loop statement agrees with its row's description.
#
#  `quote` is the manual's description of the point, verbatim and attributed (CC BY-SA 4.0).
#  Every quote and every parenthesised 20.07 name was checked to occur in the text of the PDF
#  with the sha256 below, whitespace ignored, when this file was written on 13 October 2026.


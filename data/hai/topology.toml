[[subsystems]]
subsystem_id = "p2-turbine"
label = "P2 — turbine process (GE Rotor Kit, Mark VIe DCS)"
source = """
The manual, "HAI TESTBED — P2: TURBINE PROCESS" (p. 5): one GE Rotor Kit under one Mark VIe DCS, \
comprising a motor system with a DC speed control device and a rotor system carrying the shaft, \
two balance wheels, two journal bearings and a bearing block, instrumented by one speedometer and \
four vibration proximity probes. Every P2_* point in HAI 21.03 belongs to that one machine.

Not split finer, for two independent reasons. Figure 1 distinguishes a motor system (P2a) from a \
rotor system (P2b), but the manual assigns no data point to either. The two documented control \
functions — P2-SC speed control and P2-TRIP over-speed/over-vibration trip, both p. 10 — are not \
a partition: the trip description and the speed-control description both take P2_SIT01 as their \
input. And three of these 22 columns, P2_CO_rpm, P2_HILout and P2_SIT02, have no entry in the \
manual's data-point table under any name, so for those the documentation supports no assignment \
below the process prefix carried in the column name itself.
"""
signals = [
  "P2_24Vdc",
  "P2_ASD",
  "P2_AutoGO",
  "P2_CO_rpm",
  "P2_Emerg",
  "P2_HILout",
  "P2_MSD",
  "P2_ManualGO",
  "P2_OnOff",
  "P2_RTR",
  "P2_SIT01",
  "P2_SIT02",
  "P2_TripEx",
  "P2_VT01",
  "P2_VTR01",
  "P2_VTR02",
  "P2_VTR03",
  "P2_VTR04",
  "P2_VXT02",
  "P2_VXT03",
  "P2_VYT02",
  "P2_VYT03",

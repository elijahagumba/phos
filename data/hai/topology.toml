#  HAI 21.03 — subsystem topology
#
#  Which signals are instrumented on the same physical unit. Hand-authored from the corpus
#  authors' published documentation and from nothing else. Never derived from the data: see
#  docs/adr/0010-declared-topology-and-the-granularity-hai-supports.md for why inferring
#  membership from co-movement would be circular.
#
#  Sole documentary source, cited throughout as "the manual":
#
#      HAI Dataset Technical Details, document version 4.0, released May 31 2023.
#      https://github.com/icsdataset/hai/blob/master/hai_dataset_technical_details.pdf
#      Page numbers below are the document's own printed page numbers.
#
#  This is the only manual the HAI repository publishes — its git history holds a single commit,
#  so the 21.03-era v2.0 revision described in the change log is not retrievable. Two consequences
#  are recorded in the ADR and matter when reading the assignments below:
#
#    1. The manual's data-point table uses HAI 22.04/23.05 tag names. Several 21.03 columns are
#       named differently (P2_ASD for P2_AutoSD, P2_MSD for P2_ManualSD, P2_VXT02/VYT02/VXT03/
#       VYT03 for P2_VIBTR01..04), and three 21.03 columns — P2_CO_rpm, P2_HILout, P2_SIT02 —
#       appear in the table under no name at all.
#    2. The manual states HAI 21.03 carries 78 data points (p. 1 and p. 36). It carries 79. The
#       manual's own column arithmetic on p. 36 — "84 columns", one timestamp and four label
#       columns — corroborates 79 rather than 78.
#
#  Granularity: this map is at process level for P1, P2 and P3, and splits P4 into the three
#  simulated machines the manual names per point. That is the finest split the documentation
#  supports as a partition. The ADR records what finer splits were available, and why each was
#  declined rather than merely unavailable.

schema_version = 1
corpus = "hai"


[[subsystems]]
subsystem_id = "p1-boiler"
label = "P1 — boiler process (water-to-water heat transfer, Emerson Ovation DCS)"
source = """
The manual, "HAI TESTBED — P1: BOILER PROCESS" (p. 4) with Figure 1, the process flow diagram: \
the boiler is one closed water circuit — main water tank (P1a), heat transfer system (P1b), \
return water tank (P1c), heating water tank (P1d), heating system (P1e), cooling system (P1f) — \
under a single Emerson Ovation DCS. Every P1_* point in HAI 21.03 is one of its eleven sensors, \
three actuators, six valves or five operator setpoints (p. 5).

Not split finer, though the manual describes structure that looks splittable. Figures 4-8 \
(pp. 7-8) decompose the boiler into five feedback control loops, but that decomposition is a \
covering rather than a partition and does not cover this corpus: it names only 26 of these 38 \
points, and P1_FCV03D appears in two loops at once — commanded by P1-FC (Figure 6) and a \
feed-forward input to P1-LC (Figure 5). The twelve points no loop diagram mentions are the two \
main water pumps, the heating water pump and its supply pressure, the heating water tank's \
temperature and outflow setpoint, one flow transmitter pair, and the DCS start/stop. Figure 1 \
does name six physical vessels and systems, but the manual assigns no data point to any of them, \
and eighteen of these points name no vessel in their description either. Splitting on either \
basis would require inventing a tie-break rule and a residual bucket, which is inference wearing \
a citation.
"""
signals = [
  "P1_B2004",
  "P1_B2016",
  "P1_B3004",
  "P1_B3005",
  "P1_B4002",
  "P1_B4005",
  "P1_B400B",
  "P1_B4022",
  "P1_FCV01D",
  "P1_FCV01Z",
  "P1_FCV02D",
  "P1_FCV02Z",
  "P1_FCV03D",
  "P1_FCV03Z",
  "P1_FT01",
  "P1_FT01Z",
  "P1_FT02",
  "P1_FT02Z",
  "P1_FT03",
  "P1_FT03Z",
  "P1_LCV01D",
  "P1_LCV01Z",
  "P1_LIT01",
  "P1_PCV01D",
  "P1_PCV01Z",
  "P1_PCV02D",
  "P1_PCV02Z",
  "P1_PIT01",
  "P1_PIT02",
  "P1_PP01AD",
  "P1_PP01AR",
  "P1_PP01BD",
  "P1_PP01BR",

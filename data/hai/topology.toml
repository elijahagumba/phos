[[subsystems]]
subsystem_id = "p3-water-treatment"
label = "P3 — water treatment process (Siemens S7-300 PLC)"
source = """
The manual, "HAI TESTBED — P3: WATER-TREATMENT PROCESS" (p. 5) and "WATER TREATMENT CONTROL" with \
Figure 13 (p. 11). The manual documents exactly one feedback loop for this process, P3-LC, which \
drives the level control valve LCV01 and the level control pump LCP01 from the HIL simulator's \
discharge and pumping demands against the upper reservoir's level LT01 and its high and low \
setpoints LH01/LL01. All seven HAI 21.03 columns are that loop's instrumentation and setpoints, \
plus the flow and pressure transmitters on the line into the upper tank. The manual describes \
nothing finer, and with a single documented loop there is nothing finer to describe.
"""
signals = [
  "P3_FIT01",
  "P3_LCP01D",
  "P3_LCV01D",
  "P3_LH",
  "P3_LIT01",
  "P3_LL",
  "P3_PIT01",
]


[[subsystems]]
subsystem_id = "p4-steam-turbine"
label = "P4 — steam turbine model and its power generator (simulated)"
source = """
The manual, "P4: HARDWARE-IN-THE-LOOP SIMULATOR" (p. 5), which identifies the steam turbine model \
(STM, P4.1) and the power generator model it drives (P4.2) as one simulated machine: the boiler's \
temperature and pressure set the steam entering the STM, an internal governor controls its output \
power, and the generator model produces the corresponding electrical power.

Membership is not read off the ST_ name prefix but off the manual's own per-point descriptions in \
the data-point table (rows 81-87, pp. 14-15), each of which names the STM explicitly: frequency \
deviation of STM, gate opening rate of STM, electrical load demand of STM, output power of STM, \
scheduled power demand of STM, digital value of steam pressure of STM, digital value of steam \
temperature of STM.
"""
signals = [
  "P4_ST_FD",
  "P4_ST_GOV",
  "P4_ST_LD",
  "P4_ST_PO",
  "P4_ST_PS",
  "P4_ST_PT01",
  "P4_ST_TT01",
]


[[subsystems]]
subsystem_id = "p4-hydro-turbine"
label = "P4 — hydro turbine model and its power generator (simulated)"
source = """
The manual, "P4: HARDWARE-IN-THE-LOOP SIMULATOR" (p. 5), which identifies the hydro turbine model \
(HTM, P4.3) and the power generator model it drives (P4.4) as a second simulated machine, \
computing generated output power from the water treatment process's discharge.

As with the steam train, membership comes from the manual's per-point descriptions (rows 76-79, \
p. 14) rather than from the HT_ prefix: frequency deviation of HTM, electrical load demand of \
HTM, output power of HTM, scheduled power demand of HTM.
"""
signals = [
  "P4_HT_FD",
  "P4_HT_LD",
  "P4_HT_PO",
  "P4_HT_PS",
]


[[subsystems]]
subsystem_id = "p4-power-grid"
label = "P4 — power grid model (simulated)"
source = """
The manual, "P4: HARDWARE-IN-THE-LOOP SIMULATOR" (p. 5): the simulator holds two synchronous \
generator models and "one power grid model, which included the local load demand and was \
connected to an infinite bus" — a third distinct simulated unit, which both turbine trains are \
regulated against to hold the microgrid at 60 Hz (P4.5).

One point is instrumented on it. The data-point table (row 80, p. 15) describes P4_LD as the \
*total* electrical load demand, which is what distinguishes it from the per-machine P4_ST_LD and \
P4_HT_LD assigned above. A one-signal subsystem contributes no reduction and is declared anyway, \
because the alternative is folding it into a machine the manual does not put it on.
"""
signals = [
  "P4_LD",
]

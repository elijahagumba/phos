#  Graded attack battery — jacketed batch reactor.
#
#  Twenty attacks: five kinds at four points on the difficulty dial. There are only five kinds
#  here, and the absence is the point. This plant declares NO CONTROL NETWORK, so it emits no
#  capture and no command attack can be staged against it — the generator refuses one rather than
#  inventing traffic for a wire that does not exist.
#
#  That makes it the control case for the whole question P3 left open. On this plant Atlas is deaf
#  to commands by construction, so whatever it detects here it detects from process behaviour
#  alone. Comparing it against the works and the machine is how D3 can say what command visibility
#  is actually worth.
#
#  THESE ARE ATTACKS WE DESIGNED. See ATTACKS_ARE_OURS_CAVEAT in the manifest.


# PHOS is unlicensed research; green CI is not live-site readiness.
name: research-core quality

on:
  push:
  pull_request:

jobs:
  research-core:
    name: research-core quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history, because the evidence gate below resolves every cited commit against it.
      # At the default depth of 1 no cited object exists, and every resolving citation in the
      # records would be reported as an orphan.
      - name: Check out the research core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync pinned dependencies including the dev group
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      # A cited commit or path that stops resolving makes the claim uncheckable, which is the
      # failure this project cares most about. An item that does not resolve for a stated
      # reason is acknowledged beside the citation and passes; one nobody has explained, and
      # an acknowledgement that no longer matches its citation, fail here.
      #
      # The lab only. This file is exported to the public repository, whose history is a
      # separate chain of export commits and whose tree is the manifest's subset, so the lab
      # commits and lab-only paths the records cite genuinely do not exist there. Running the
      # gate on that checkout would fail on the split itself rather than on a broken citation.
      - name: Cited evidence resolves
        if: github.repository == 'elijahagumba/phoslabs'
        run: uv run python scripts/audit_evidence.py --strict

      # Lab only, for the same reason as the evidence gate. The public repository is a separate
      # history and does not carry the lab branches a taken number would be hiding on.
      - name: Fetch every branch so a taken number is visible
        if: github.repository == 'elijahagumba/phoslabs'
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: A new ADR or note number is not already taken
        if: github.repository == 'elijahagumba/phoslabs'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FROM="origin/${BASE_REF}"
          elif [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FROM="origin/main"
          else
            FROM="$EVENT_BEFORE"
          fi
          uv run python scripts/check_number_allocation.py --from "$FROM" --to HEAD

# PHOS is unlicensed research; green CI is not live-site readiness.
name: research-core quality

on:
  push:
  pull_request:

jobs:
  research-core:
    name: research-core quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the research core
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync pinned dependencies including the dev group
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

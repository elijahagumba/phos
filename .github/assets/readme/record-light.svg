<svg xmlns="http://www.w3.org/2000/svg" width="600" height="244" viewBox="0 0 600 244" role="img" aria-label="The record: everything PHOS has measured, including what didn't work"><title>The record: everything PHOS has measured, including what didn't work</title><!-- Type: Inter, SIL Open Font License 1.1, (c) The Inter Project Authors. --><style>@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:'PHOS Inter',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-feature-settings:'cv11','ss01';}.figure,.result,.tick{font-feature-settings:'cv11','ss01','tnum';}.hero{font-size:40px;font-weight:600;letter-spacing:-0.9px;fill:#000000;}.sheet{font-size:48px;font-weight:600;letter-spacing:-1.05px;fill:#000000;}.creed{font-size:17px;font-weight:400;letter-spacing:0.0px;fill:#2A2A2E;}.spec{font-size:15px;font-weight:500;letter-spacing:0.0px;fill:#000000;}.specbody{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.law{font-size:16px;font-weight:500;letter-spacing:0.0px;fill:#000000;}.cover{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#2A2A2E;}.coverlabel{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.oncover{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.title{font-size:26px;font-weight:600;letter-spacing:-0.5px;fill:#000000;}.label{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.body{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#2A2A2E;}.strong{font-size:15px;font-weight:600;letter-spacing:0.0px;fill:#000000;}.muted{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.note{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.calloutlabel{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.callout{font-size:15px;font-weight:500;letter-spacing:0.0px;fill:#000000;}.figure{font-size:32px;font-weight:600;letter-spacing:-0.7px;fill:#000000;}.poster{font-size:22px;font-weight:600;letter-spacing:-0.4px;fill:#000000;}.result{font-size:15px;font-weight:600;letter-spacing:0.0px;fill:#000000;}.caption{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.tick{font-size:11px;font-weight:500;letter-spacing:0.0px;fill:#6B6B70;}.node{font-size:13px;font-weight:500;letter-spacing:0.0px;fill:#000000;}</style><rect width="600" height="244" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="599" height="243" fill="none" stroke="#E3E3E6"/><text x="40.0" y="44"><tspan class="label">THE RECORD</tspan></text><text x="40.0" y="84"><tspan class="title">Everything PHOS has measured.</tspan></text><text x="40.0" y="116"><tspan class="title">Including what didn’t work.</tspan></text><text x="40.0" y="172"><tspan class="body">Each number here can be rebuilt from this</tspan></text><text x="40.0" y="200"><tspan class="body">repository. Each limit says what would lift it.</tspan></text></svg>

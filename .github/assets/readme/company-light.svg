<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-label="A named law is held, broken, or unstated. Only a broken law takes a slot. At most eight. A score is refused. A break is not an attack."><title>A named law is held, broken, or unstated. Only a broken law takes a slot. At most eight. A score is refused. A break is not an attack.</title><!-- Type: Inter, SIL Open Font License 1.1, (c) The Inter Project Authors. --><style>@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:'PHOS Inter',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-feature-settings:'cv11','ss01';}.figure,.result,.tick{font-feature-settings:'cv11','ss01','tnum';}.hero{font-size:40px;font-weight:600;letter-spacing:-0.9px;fill:#000000;}.sheet{font-size:48px;font-weight:600;letter-spacing:-1.05px;fill:#000000;}.creed{font-size:17px;font-weight:400;letter-spacing:0.0px;fill:#2A2A2E;}.spec{font-size:15px;font-weight:500;letter-spacing:0.0px;fill:#000000;}.specbody{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.law{font-size:16px;font-weight:500;letter-spacing:0.0px;fill:#000000;}.cover{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#2A2A2E;}.coverlabel{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.oncover{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.title{font-size:26px;font-weight:600;letter-spacing:-0.5px;fill:#000000;}.label{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.body{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#2A2A2E;}.strong{font-size:15px;font-weight:600;letter-spacing:0.0px;fill:#000000;}.muted{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.note{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.calloutlabel{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#6B6B70;}.callout{font-size:15px;font-weight:500;letter-spacing:0.0px;fill:#000000;}.figure{font-size:32px;font-weight:600;letter-spacing:-0.7px;fill:#000000;}.poster{font-size:22px;font-weight:600;letter-spacing:-0.4px;fill:#000000;}.result{font-size:15px;font-weight:600;letter-spacing:0.0px;fill:#000000;}.caption{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#6B6B70;}.tick{font-size:11px;font-weight:500;letter-spacing:0.0px;fill:#6B6B70;}.node{font-size:13px;font-weight:500;letter-spacing:0.0px;fill:#000000;}</style><rect width="600" height="560" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="599" height="559" fill="none" stroke="#E3E3E6"/><text x="40.0" y="44"><tspan class="label">02    WHAT PHOS IS</tspan></text><text x="40.0" y="84"><tspan class="title">PHOS is the company.</tspan></text><text x="40.0" y="116"><tspan class="title">Atlas is the engine.</tspan></text><line x1="164.9" y1="189.5" x2="295.1" y2="282.5" stroke="#2A2A2E" stroke-width="1.25"/><line x1="435.1" y1="189.5" x2="304.9" y2="282.5" stroke="#2A2A2E" stroke-width="1.25"/><circle cx="160.0" cy="186.0" r="6.0" fill="#000000" stroke="#000000" stroke-width="1.5"/><circle cx="440.0" cy="186.0" r="6.0" fill="#000000" stroke="#000000" stroke-width="1.5"/><circle cx="300.0" cy="286.0" r="7.0" fill="#1F5FC4" stroke="#1F5FC4" stroke-width="1.5"/><text x="134.8" y="166.0"><tspan class="node">Process</tspan></text><text x="413.6" y="166.0"><tspan class="node">Network</tspan></text><text x="284.3" y="308.0"><tspan class="node">Atlas</tspan></text><text x="40.0" y="348"><tspan class="body">A named law is held, broken, or unstated.</tspan></text><text x="40.0" y="370"><tspan class="body">Only a broken law takes a slot. At most eight.</tspan></text><text x="40.0" y="392"><tspan class="strong">A score is refused. A break is not an attack.</tspan></text><text x="40.0" y="416"><tspan class="note">Held: the check ran and the law stood. Unstated:</tspan></text><text x="40.0" y="434"><tspan class="note">the law was named, and nothing was there to check.</tspan></text><line x1="40" y1="462" x2="560" y2="462" stroke="#D6D6DA" stroke-width="1"/><circle cx="44.0" cy="500.0" r="6.0" fill="none" stroke="#6B6B70" stroke-width="1.5" stroke-dasharray="3 3"/><text x="64.0" y="504"><tspan class="node">Sentiel</tspan></text><text x="64.0" y="524"><tspan class="note">Planned. Not ready to stand next to Atlas.</tspan></text></svg>

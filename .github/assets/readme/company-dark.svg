nt-size:15px;font-weight:400;letter-spacing:0.0px;fill:#8E8E93;}.note{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#8E8E93;}.calloutlabel{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#8E8E93;}.callout{font-size:15px;font-weight:500;letter-spacing:0.0px;fill:#F5F5F7;}.figure{font-size:32px;font-weight:600;letter-spacing:-0.7px;fill:#F5F5F7;}.poster{font-size:22px;font-weight:600;letter-spacing:-0.4px;fill:#F5F5F7;}.result{font-size:15px;font-weight:600;letter-spacing:0.0px;fill:#F5F5F7;}.caption{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#8E8E93;}.tick{font-size:11px;font-weight:500;letter-spacing:0.0px;fill:#8E8E93;}.node{font-size:13px;font-weight:500;letter-spacing:0.0px;fill:#F5F5F7;}</style><rect width="600" height="664" fill="#000000"/><rect x="0.5" y="0.5" width="599" height="663" fill="none" stroke="#1C1C1E"/><text x="60.0" y="56.0"><tspan class="label">02    WHAT PHOS IS</tspan></text><text x="60.0" y="104.0"><tspan class="title">PHOS is the company.</tspan></text><text x="60.0" y="140.0"><tspan class="title">Atlas is the engine.</tspan></text><line x1="168.8" y1="227.6" x2="295.2" y2="320.4" stroke="#EBEBF0" stroke-width="1.25"/><line x1="431.2" y1="227.6" x2="304.8" y2="320.4" stroke="#EBEBF0" stroke-width="1.25"/><circle cx="164.0" cy="224.0" r="6.0" fill="#F5F5F7" stroke="#F5F5F7" stroke-width="1.5"/><circle cx="436.0" cy="224.0" r="6.0" fill="#F5F5F7" stroke="#F5F5F7" stroke-width="1.5"/><circle cx="300.0" cy="324.0" r="7.0" fill="#2D72D2" stroke="#2D72D2" stroke-width="1.5"/><text x="138.8" y="204.0"><tspan class="node">Process</tspan></text><text x="409.6" y="204.0"><tspan class="node">Network</tspan></text><text x="284.3" y="346.0"><tspan class="node">Atlas</tspan></text><text x="60.0" y="404.0"><tspan class="body">A named law is held, broken, or unstated.</tspan></text><text x="60.0" y="430.0"><tspan class="body">Only a broken law takes a slot. At most eight.</tspan></text><text x="60.0" y="456.0"><tspan class="strong">A score is refused. A break is not an attack.</tspan></text><text x="60.0" y="488.0"><tspan class="note">Held: the check ran and the law stood. Unstated:</tspan></text><text x="60.0" y="510.0"><tspan class="note">the law was named, and nothing was there to check.</tspan></text><line x1="60" y1="544.0" x2="540" y2="544.0" stroke="#2C2C2E" stroke-width="1"/><circle cx="64.0" cy="582.0" r="6.0" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="3 3"/><text x="84.0" y="586.0"><tspan class="node">Sentiel</tspan></text><text x="84.0" y="608.0"><tspan class="note">Planned. Not ready to stand next to Atlas.</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="The record: everything PHOS has measured, including what didn't work"><title>The record: everything PHOS has measured, including what didn't work</title><!-- Type: Inter, SIL Open Font License 1.1, (c) The Inter Project Authors. --><style>@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PHOS Inter';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:'PHOS Inter',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-feature-settings:'cv11','ss01';}.figure,.result,.tick{font-feature-settings:'cv11','ss01','tnum';}.hero{font-size:40px;font-weight:600;letter-spacing:-0.9px;fill:#F5F5F7;}.sheet{font-size:42px;font-weight:600;letter-spacing:-0.92px;fill:#F5F5F7;}.creed{font-size:17px;font-weight:400;letter-spacing:0.0px;fill:#EBEBF0;}.spec{font-size:15px;font-weight:500;letter-spacing:0.0px;fill:#F5F5F7;}.specbody{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#8E8E93;}.law{font-size:16px;font-weight:500;letter-spacing:0.0px;fill:#F5F5F7;}.cover{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#EBEBF0;}.coverlabel{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#8E8E93;}.oncover{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#8E8E93;}.title{font-size:26px;font-weight:600;letter-spacing:-0.5px;fill:#F5F5F7;}.label{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#8E8E93;}.body{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#EBEBF0;}.strong{font-size:15px;font-weight:600;letter-spacing:0.0px;fill:#F5F5F7;}.muted{font-size:15px;font-weight:400;letter-spacing:0.0px;fill:#8E8E93;}.note{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#8E8E93;}.calloutlabel{font-size:12px;font-weight:500;letter-spacing:0.4px;fill:#8E8E93;}.callout{font-size:15px;font-weight:500;letter-spacing:0.0px;fill:#F5F5F7;}.figure{font-size:32px;font-weight:600;letter-spacing:-0.7px;fill:#F5F5F7;}.poster{font-size:22px;font-weight:600;letter-spacing:-0.4px;fill:#F5F5F7;}.result{font-size:15px;font-weight:600;letter-spacing:0.0px;fill:#F5F5F7;}.caption{font-size:13px;font-weight:400;letter-spacing:0.0px;fill:#8E8E93;}.tick{font-size:11px;font-weight:500;letter-spacing:0.0px;fill:#8E8E93;}.node{font-size:13px;font-weight:500;letter-spacing:0.0px;fill:#F5F5F7;}</style><rect width="600" height="300" fill="#000000"/><rect x="0.5" y="0.5" width="599" height="299" fill="none" stroke="#1C1C1E"/><text x="60.0" y="56.0"><tspan class="label">THE RECORD</tspan></text><text x="60.0" y="104.0"><tspan class="title">Everything PHOS has measured.</tspan></text><text x="60.0" y="140.0"><tspan class="title">Including what didn’t work.</tspan></text><text x="60.0" y="212"><tspan class="body">Each number here can be rebuilt from this</tspan></text><text x="60.0" y="238.0"><tspan class="body">repository. Each limit says what would lift it.</tspan></text></svg>
